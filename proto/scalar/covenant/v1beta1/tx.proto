syntax = "proto3";
package scalar.covenant.v1beta1;

import "gogoproto/gogo.proto";
import "scalar/covenant/exported/v1beta1/custodian.proto";
import "scalar/covenant/exported/v1beta1/types.proto";
import "scalar/covenant/v1beta1/types.proto";
import "scalar/permission/exported/v1beta1/types.proto";

option go_package = "github.com/scalarorg/scalar-core/x/covenant/types";
option (gogoproto.goproto_getters_all) = false;

message CreateCustodianRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];

  string name = 2;
  bytes bitcoin_pubkey = 3;
  scalar.covenant.exported.v1beta1.Status status = 4;
  string description = 5;
}

message CreateCustodianResponse {
  scalar.covenant.exported.v1beta1.Custodian custodian = 1;
}

// Pubkey used as key for lookup custodian to update other values
message UpdateCustodianRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  bytes bitcoin_pubkey = 2;
  string name = 3;
  scalar.covenant.exported.v1beta1.Status status = 4;
  string description = 5;
}

message UpdateCustodianResponse {
  scalar.covenant.exported.v1beta1.Custodian custodian = 1;
}

message CreateCustodianGroupRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string uid = 2;
  string name = 3;
  uint32 quorum = 4;
  scalar.covenant.exported.v1beta1.Status status = 5;
  string description = 6;
  repeated bytes custodian = 7;
}

message CreateCustodianGroupResponse {
  scalar.covenant.exported.v1beta1.CustodianGroup group = 1;
}

message UpdateCustodianGroupRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string uid = 2;
  string name = 3;
  uint32 quorum = 4;
  scalar.covenant.exported.v1beta1.Status status = 5;
  string description = 6;
  repeated bytes custodian = 7;
}

message UpdateCustodianGroupResponse {
  scalar.covenant.exported.v1beta1.CustodianGroup group = 1;
}

message AddCustodianToGroupRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string guid = 2; // CustodianGroup uid
  bytes custodian_pubkey = 3;
  string description = 4;
}

message RemoveCustodianFromGroupRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string guid = 2; // CustodianGroup uid
  bytes custodian_pubkey = 3;
  string description = 4;
}

message CustodianToGroupResponse {
  scalar.covenant.exported.v1beta1.CustodianGroup group = 1;
}

message SubmitTapScriptSigsRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  uint64 sig_id = 2 [(gogoproto.customname) = "SigID"];
  repeated scalar.covenant.exported.v1beta1.TapScriptSigsMap list_of_tap_script_sigs_map = 3;
}

message SubmitTapScriptSigsResponse {}

// Rotate key for custodian group
message RotateKeyRequest {
  option (scalar.permission.exported.v1beta1.permission_role) = ROLE_CHAIN_MANAGEMENT;
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
}

message RotateKeyResponse {}

message UpdateNewBtcBlockRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  uint64 height = 3;
}
message UpdateNewBtcBlockResponse {}

message ConfirmRedeemTxRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  bytes tx_id = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "Hash",
    (gogoproto.customname) = "TxID"
  ];
}
message ConfirmRedeemTxResponse {}

message ConfirmSwitchedPhaseRequest {
  bytes sender = 1 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.AccAddress"];
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  bytes tx_id = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "Hash",
    (gogoproto.customname) = "TxID"
  ];
}
message ConfirmSwitchedPhaseResponse {}
