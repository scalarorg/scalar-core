syntax = "proto3";
package scalar.covenant.v1beta1;

import "gogoproto/gogo.proto";
import "scalar/covenant/v1beta1/redeem.proto";
import "scalar/covenant/exported/v1beta1/types.proto";
import "scalar/chains/v1beta1/types.proto";

option go_package = "github.com/scalarorg/scalar-core/x/covenant/types";

message SigningPsbtStarted {
  option (gogoproto.stable_marshaler) = true;

  string module = 1;
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  uint64 sig_id = 3 [(gogoproto.customname) = "SigID"];
  string key_id = 4 [
    (gogoproto.customname) = "KeyID",
    (gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/multisig/exported.KeyID"
  ];
  map<string, bytes> pub_keys = 5 [(gogoproto.castvalue) = "github.com/scalarorg/scalar-core/x/multisig/exported.PublicKey"];
  string requesting_module = 6;
  repeated bytes multi_psbt = 7 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/covenant/exported.Psbt"];
}

message SigningPsbtCompleted {
  string module = 1;
  uint64 sig_id = 2 [(gogoproto.customname) = "SigID"];
}

message SigningPsbtExpired {
  string module = 1;
  uint64 sig_id = 2 [(gogoproto.customname) = "SigID"];
}

message TapScriptSigsSubmitted {
  string module = 1;
  uint64 sig_id = 2 [(gogoproto.customname) = "SigID"];
  bytes participant = 3 [(gogoproto.casttype) = "github.com/cosmos/cosmos-sdk/types.ValAddress"];
  repeated scalar.covenant.exported.v1beta1.TapScriptSigsMap list_of_tap_script_sigs_map = 4;
}

message KeyRotated {
  string module = 1;
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  string key_id = 3 [
    (gogoproto.customname) = "KeyID",
    (gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/multisig/exported.KeyID"
  ];
}

message SwitchPhaseStarted {
  string module = 1;
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  string symbol = 3;
  uint64 sequence = 4;
  //Current phase
  scalar.covenant.v1beta1.Phase phase = 5;
  //Next sequence and phase encoded in the payload
  string execute_data = 6 [(gogoproto.customname) = "ExecuteData"];
}

message SwitchPhaseCompleted {
  string module = 1;
  uint64 sequence = 2;
  scalar.covenant.v1beta1.Phase phase = 3;
}

message ConfirmRedeemTxStarted {
  repeated scalar.chains.v1beta1.PollMapping poll_mappings = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "poll_mappings,omitempty"
  ];
  string chain = 2
      [ (gogoproto.casttype) =
            "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName" ];
  uint64 confirmation_height = 3;
  repeated bytes participants = 4
      [ (gogoproto.casttype) =
            "github.com/cosmos/cosmos-sdk/types.ValAddress" ];
}


message Event {
  enum Status {
    option (gogoproto.goproto_enum_prefix) = false;
    option (gogoproto.goproto_enum_stringer) = true;

    STATUS_UNSPECIFIED = 0 [(gogoproto.enumvalue_customname) = "EventNonExistent"];
    STATUS_CONFIRMED = 1 [(gogoproto.enumvalue_customname) = "EventConfirmed"];
    STATUS_COMPLETED = 2 [(gogoproto.enumvalue_customname) = "EventCompleted"];
    STATUS_FAILED = 3 [(gogoproto.enumvalue_customname) = "EventFailed"];
  }

  string chain = 1 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  bytes hash = 2 [
    (gogoproto.customname) = "Hash",
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/scalarorg/scalar-core/x/chains/exported.Hash"
  ];
  Status status = 3;
  uint64 index = 4;
  oneof event {
    RedeemTxConfirmed redeem_tx_confirmed = 13;
    SessionConfirmed session_confirmed = 15;
  }
}

message RedeemTxConfirmed {
  string event_id = 1
      [ (gogoproto.customname) = "EventID", (gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/chains/types.EventID" ];
  string chain = 2
      [ (gogoproto.casttype) =
            "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName" ];
}
message SessionConfirmed {
  uint64 session_sequence = 1 [ (gogoproto.customname) = "SessionSequence" ];
  uint64 phase_sequence = 2 [ (gogoproto.customname) = "PhaseSequence" ];
}

