syntax = "proto3";
package scalar.covenant.v1beta1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "scalar/covenant/exported/v1beta1/custodian.proto";
import "scalar/covenant/v1beta1/params.proto";
import "scalar/covenant/v1beta1/redeem.proto";
import "scalar/covenant/v1beta1/command.proto";
import "scalar/covenant/v1beta1/types.proto";
import "scalar/multisig/exported/v1beta1/types.proto";
import "scalar/multisig/v1beta1/query.proto";

option go_package = "github.com/scalarorg/scalar-core/x/covenant/types";

message CustodiansRequest {
  string name = 1;
  bytes pubkey = 2;
  scalar.covenant.exported.v1beta1.Status status = 3;
}

message CustodiansResponse {
  repeated scalar.covenant.exported.v1beta1.Custodian custodians = 1;
}

message GroupsRequest {
  bytes uid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) =
        "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "UID"
  ];
}

message GroupsResponse {
  repeated scalar.covenant.exported.v1beta1.CustodianGroup groups = 1;
}

// ParamsRequest represents a message that queries the params
message ParamsRequest {}

message ParamsResponse { Params params = 1 [ (gogoproto.nullable) = false ]; }

message KeyRequest { string chain = 1; }

// KeyResponse contains the key corresponding to a given key id.
message KeyResponse {
  string key_id = 1 [
    (gogoproto.customname) = "KeyID",
    (gogoproto.casttype) =
        "github.com/scalarorg/scalar-core/x/multisig/exported.KeyID"
  ];
  multisig.exported.v1beta1.KeyState state = 2;
  int64 started_at = 3;
  google.protobuf.Timestamp started_at_timestamp = 4
      [ (gogoproto.nullable) = false, (gogoproto.stdtime) = true ];
  bytes threshold_weight = 5 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Uint",
    (gogoproto.nullable) = false
  ];
  bytes bonded_weight = 6 [
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Uint",
    (gogoproto.nullable) = false
  ];
  // Keygen participants in descending order by weight
  repeated multisig.v1beta1.KeygenParticipant participants = 7
      [ (gogoproto.nullable) = false ];
}

message RedeemSessionRequest {
  bytes uid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) =
        "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "UID"
  ];
}

message RedeemSessionResponse { RedeemSession session = 1; }

message UTXOSnapshotRequest {
  bytes uid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) =
        "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "UID"
  ];
}

message UTXOSnapshotResponse { UTXOSnapshot utxo_snapshot = 1; }

message StandaloneCommandRequest {
  bytes id = 1 [ (gogoproto.customname) = "ID" ];
}

message StandaloneCommandResponse {
  bytes id = 1 [ (gogoproto.customname) = "ID" ];
  string data = 2;
  StandaloneCommandStatus status = 3;
  string key_id = 4 [
    (gogoproto.customname) = "KeyID",
    (gogoproto.casttype) =
        "github.com/scalarorg/scalar-core/x/multisig/exported.KeyID"
  ];
  string execute_data = 5;
}