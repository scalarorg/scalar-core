syntax = "proto3";
package scalar.covenant.v1beta1;

import "gogoproto/gogo.proto";
import "scalar/covenant/exported/v1beta1/types.proto";

option go_package = "github.com/scalarorg/scalar-core/x/covenant/types";
option (gogoproto.goproto_getters_all) = false;

message UTXO {
  bytes txid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "TxID"
  ];
  uint32 vout = 2;
  bytes script_pubkey = 3;
  uint64 amount_in_sats = 4;
  // Reserved amount for each request id
  map<string, uint64> reserved = 5;
}

message UTXOSnapshot {
  bytes custodian_group_uid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "CustodianGroupUID"
  ];
  uint64 block_height = 2;
  repeated UTXO utxos = 3;
}

message RedeemSession {
  bytes custodian_group_uid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "CustodianGroupUID"
  ];
  uint64 sequence = 2;
  scalar.covenant.exported.v1beta1.Phase current_phase = 3;
  bytes last_redeem_tx = 4 [
    (gogoproto.customtype) = "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "LastRedeemTx"
  ];
  bool is_switching = 5;
  uint64 phase_expired_at = 6;
}

message ExpiredEvmSession {
  bytes custodian_group_uid = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) = "github.com/scalarorg/scalar-core/x/chains/exported.Hash",
    (gogoproto.customname) = "CustodianGroupUID"
  ];
  string chain = 2 [(gogoproto.casttype) = "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName"];
  uint64 sequence = 3;
  scalar.covenant.exported.v1beta1.Phase current_phase = 4;
  repeated string tokens = 5;
}
