syntax = "proto3";
package scalar.covenant.v1beta1;

import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/scalarorg/scalar-core/x/covenant/types";

enum CommandStatus {
  option (gogoproto.goproto_enum_prefix) = false;
  COMMAND_STATUS_UNSPECIFIED = 0
      [ (gogoproto.enumvalue_customname) = "CommandStatusNonExistent" ];
  COMMAND_STATUS_SIGNING = 1
      [ (gogoproto.enumvalue_customname) = "CommandStatusSigning" ];
  COMMAND_STATUS_ABORTED = 2
      [ (gogoproto.enumvalue_customname) = "CommandStatusAborted" ];
  COMMAND_STATUS_SIGNED = 3
      [ (gogoproto.enumvalue_customname) = "CommandStatusSigned" ];
}

message CommandMetadata {
  bytes id = 1 [ (gogoproto.customname) = "ID" ];
  bytes data = 2;
  bytes sig_hash = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.customtype) =
        "github.com/scalarorg/scalar-core/x/chains/exported.Hash"
  ];
  CommandStatus status = 4;
  string key_id = 5 [
    (gogoproto.customname) = "KeyID",
    (gogoproto.casttype) =
        "github.com/scalarorg/scalar-core/x/multisig/exported.KeyID"
  ];
  google.protobuf.Any signature = 6
      [ (cosmos_proto.accepts_interface) =
            "github.com/cosmos/codec/ProtoMarshaler" ];
}

message CommandSigned {
  string chain = 2
      [ (gogoproto.casttype) =
            "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName" ];
  bytes command_id = 3 [ (gogoproto.customname) = "CommandID" ];
}

message CommandAborted {
  string chain = 2
      [ (gogoproto.casttype) =
            "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName" ];
  bytes command_id = 3 [ (gogoproto.customname) = "CommandID" ];
}

message SigMetadata {
  SigType type = 1;
  string chain = 2
      [ (gogoproto.casttype) =
            "github.com/scalarorg/scalar-core/x/nexus/exported.ChainName" ];
  bytes command_id = 3 [ (gogoproto.customname) = "CommandID" ];
}

enum SigType {
  option (gogoproto.goproto_enum_prefix) = false;
  option (gogoproto.goproto_enum_stringer) = true;

  SIG_TYPE_UNSPECIFIED = 0 [ (gogoproto.enumvalue_customname) = "None" ];
  SIG_TYPE_COMMAND = 1 [ (gogoproto.enumvalue_customname) = "SigCommand" ];
}